<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrieren</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #e2e8f0; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; }
    </style>
</head>
<body>
<div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card p-4" style="width: 100%; max-width: 400px;">
        <h2 class="mb-4 text-center">Registrieren</h2>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-danger">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="post">
            <div class="mb-3">
                <input type="text" name="username" class="form-control bg-dark text-light border-secondary" placeholder="Name" required>
            </div>
            <div class="mb-3">
                <input type="password" name="password" class="form-control bg-dark text-light border-secondary" placeholder="Passwort" required>
            </div>
            <div class="mb-3">
                <input type="text" name="invite_code" class="form-control bg-dark text-light border-secondary" placeholder="Einladungscode (optional)" value="{{ request.args.get('code','') }}">
            </div>
            <button class="btn btn-success w-100">Registrieren</button>
        </form>
        <p class="mt-3 text-center"><a href="{{ url_for('login') }}" class="text-info">Zum Login</a></p>
    </div>
</div>
</body>
</html>
