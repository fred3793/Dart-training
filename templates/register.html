<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #111827; color: #f3f4f6; }
        .card { background: #1f2937; border: 1px solid #374151; border-radius: 12px; }
        .form-control { background: #111827; border-color: #374151; color: #f3f4f6; }
    </style>
</head>
<body>
<div class="container d-flex align-items-center justify-content-center" style="min-height:100vh;">
    <div class="card p-4" style="width:100%; max-width:380px;">
        <h3 class="mb-4 text-center">Login</h3>
        {% with messages = get_flashed_messages() %}
            {% if messages %}{% for m in messages %}<div class="alert alert-danger">{{ m }}</div>{% endfor %}{% endif %}
        {% endwith %}
        <form method="post">
            <input type="text" name="username" class="form-control mb-3" placeholder="Name" required>
            <input type="password" name="password" class="form-control mb-3" placeholder="Passwort" required>
            <button class="btn btn-danger w-100">Einloggen</button>
        </form>
        <p class="mt-3 text-center"><a href="{{ url_for('register') }}" class="text-warning">Registrieren</a></p>
    </div>
</div>
</body>
</html>
